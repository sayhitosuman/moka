<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stream</title>
  <link rel="icon" type="image/png" href="https://i.ibb.co/mVJPnXxD/5c65fc3a-4f54-409c-827e-884d8e01c5ff.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400&display=swap"
    rel="stylesheet">
  <script>
    // Storage Quota Guard
    (function () {
      try {
        // 1. Proactive cleanup of old mock data if it exists
        const keysToRemove = ['mock_posts', 'mock_messages', 'mock_notifications', 'mock_spaces'];
        keysToRemove.forEach(k => {
          if (localStorage.getItem(k)) {
            console.log('Cleaning up old mock data for space efficiency:', k);
            localStorage.removeItem(k);
          }
        });

        // 2. Wrap setItem to handle quota errors gracefully
        const originalSetItem = localStorage.setItem;
        localStorage.setItem = function (key, value) {
          try {
            originalSetItem.apply(this, arguments);
          } catch (e) {
            if (e.name === 'QuotaExceededError' || e.name === 'NS_ERROR_DOM_QUOTA_REACHED') {
              console.warn('STORAGE_QUOTA_EXCEEDED! Attempting emergency cleanup...');
              // Clear ONLY half of the Supabase keys to see if it helps, or clear all if desperate
              for (let i = 0; i < localStorage.length; i++) {
                const k = localStorage.key(i);
                if (k && (k.includes('supabase') || k.includes('sb-'))) {
                  console.log('Emergency removal of storage key:', k);
                  localStorage.removeItem(k);
                }
              }
              // Try again once
              originalSetItem.apply(this, arguments);
            } else {
              throw e;
            }
          }
        };
      } catch (err) {
        console.error('Storage Guard caught error:', err);
      }
    })();

    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['"Playfair Display"', 'serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            paper: '#fcfbf9',
            ink: '#2d2a2e',
            'ink-light': '#5d5a5e',
            accent: '#d4a373', // muted gold/bronze
            'soft-gray': '#f2f0ec',
          },
          animation: {
            'fade-in': 'fadeIn 0.5s ease-out',
            'slide-up': 'slideUp 0.6s ease-out',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            slideUp: {
              '0%': { transform: 'translateY(20px)', opacity: '0' },
              '100%': { transform: 'translateY(0)', opacity: '1' },
            }
          }
        }
      }
    }
  </script>
  <style>
    html,
    body,
    #root {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #fcfbf9;
      color: #2d2a2e;
      font-family: 'Inter', sans-serif;
      background-image: radial-gradient(#e5e7eb 1px, transparent 1px);
      background-size: 40px 40px;
    }

    .font-serif {
      font-family: 'Playfair Display', serif;
    }

    /* Hide Scrollbar for cleaner look */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #e5e7eb;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #d1d5db;
    }

    /* Utilities for dashboard */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
